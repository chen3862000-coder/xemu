name: Swift (AppHost)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ios/AppHost

    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v
